# Render Blueprint. You can also create a Web Service in the dashboard
# with the same start command and env vars.
services:
  - type: web
    name: fund-insight
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --worker-class gthread --workers 1 --threads 8 --timeout 180 webpage.app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: HOST
        value: "0.0.0.0"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: GROQ_API_KEY
        sync: false
